name: server

on:
  push:
    # 只在分支上跑：tag 推送由 release.yml 负责（它会做同样的校验 + 产物），
    # 否则一次发版会把服务端测试与 compose 冒烟重复跑两遍。
    branches: [master, main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-compose.tls.yml"
      - "scripts/server-changed.sh"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-compose.tls.yml"
      - "scripts/server-changed.sh"
      - ".github/workflows/server.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  # 路径过滤只能看「哪些文件被碰过」；发布时三个 workspace 包会一起 bump 版本，
  # 那会让 crates/*/Cargo.toml 命中，于是纯客户端改动也会触发服务端构建。
  # 这里用 scripts/server-changed.sh 再判一次：只有「版本号以外的行」变动才算真变更。
  changes:
    name: Detect server changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要历史来 diff 基准提交
      - name: Detect
        id: detect
        env:
          BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # base 为全零（新建分支）或为空时，脚本会自动保守判为「有变更」。
          bash scripts/server-changed.sh "${BASE:-}" HEAD

  test:
    name: Test & lint
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p course-plan-server --locked
      - name: Clippy
        run: cargo clippy -p course-plan-server --all-targets --locked -- -D warnings

  # 说明：这里不再保留独立的 "Docker image" 构建 job。
  # 它只是 `docker build -f crates/server/Dockerfile .`，而下面的 compose smoke job
  # 用完全相同的 context/file（docker-compose.yml: context: . / dockerfile:
  # crates/server/Dockerfile）执行 `docker compose up -d --build` + 健康检查，
  # 覆盖面严格更强；发布侧的镜像由 release.yml 的 buildx job（amd64+arm64，带缓存）验证。

  compose:
    name: Compose smoke
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # JWT_SECRET 必须在此层设置：compose 的 ${JWT_SECRET:?} 在 up/down 等所有子命令上
    # 都会做插值校验，只给某一步设置 env 会让 `Compose down` 失败。
    env:
      JWT_SECRET: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - name: Compose up + health
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Compose down
        if: always()
        run: docker compose down -v
