name: server

on:
  push:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-compose.tls.yml"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-compose.tls.yml"
      - ".github/workflows/server.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p course-plan-server --locked
      - name: Clippy
        run: cargo clippy -p course-plan-server --all-targets --locked -- -D warnings

  # 说明：这里不再保留独立的 "Docker image" 构建 job。
  # 它只是 `docker build -f crates/server/Dockerfile .`，而下面的 compose smoke job
  # 用完全相同的 context/file（docker-compose.yml: context: . / dockerfile:
  # crates/server/Dockerfile）执行 `docker compose up -d --build` + 健康检查，
  # 覆盖面严格更强；发布侧的镜像由 release.yml 的 buildx job（amd64+arm64，带缓存）验证。

  compose:
    name: Compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose up + health
        env:
          JWT_SECRET: ci-only-secret-not-for-production
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Compose down
        if: always()
        run: docker compose down -v
