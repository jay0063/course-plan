name: server

on:
  push:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-compose.tls.yml"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-compose.tls.yml"
      - ".github/workflows/server.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p course-plan-server --locked
      - name: Clippy
        run: cargo clippy -p course-plan-server --all-targets --locked -- -D warnings

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f crates/server/Dockerfile -t courseplan-server:ci .

  compose:
    name: Compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose up + health
        env:
          JWT_SECRET: ci-only-secret-not-for-production
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Compose down
        if: always()
        run: docker compose down -v
