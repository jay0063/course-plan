name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # GPUI + wgpu 的 debug 测试二进制极大；在 runner 上并行链接会把 lld 打到 SIGBUS
  # （collect2: fatal error: ld terminated with signal 7 [Bus error]）。
  # 关闭 debuginfo 并把并行度降到 2，显著降低峰值内存。
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  client:
    name: Client (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake pkg-config libfontconfig-dev \
            libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev \
            libzstd-dev libasound2-dev libvulkan1
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # GPU / 无头渲染测试在没有 COURSEPLAN_VISUAL 时会自行跳过，
      # 因此 runner 上没有 Vulkan 适配器也能跑完整测试。
      - name: Test
        run: cargo test --workspace --locked
