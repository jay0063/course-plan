name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.1.0），必须已存在且指向要发布的提交"
        required: true
        type: string
      with_linux:
        description: "同时打包 Linux（默认关闭；2026-10-19 起暂时停用）"
        required: false
        type: boolean
        default: false
      with_macos:
        description: "同时打包 macOS（默认关闭；2026-10-19 起暂时停用）"
        required: false
        type: boolean
        default: false
      with_server_image:
        description: "强制重建服务端镜像（默认 auto：仅当服务端输入自上一个 tag 起有改动时才构建）"
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # tag 推送时用 ref（即 tag 本身）；手动触发时用 inputs.tag。
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  REGISTRY: ghcr.io
  IMAGE_BASENAME: course-plan-server

permissions:
  contents: read

jobs:
  checks:
    name: Lint and version guard
    runs-on: ubuntu-latest
    outputs:
      # 服务端输入自上一个 tag 起是否有改动（供 server-image 决定是否构建）。
      server_changed: ${{ steps.server_changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整 tag 历史来定位「上一个 tag」
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake pkg-config libfontconfig-dev \
            libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev \
            libzstd-dev libasound2-dev libvulkan1
      # 版本守卫：tag（去掉前导 v）必须与 workspace 根包 Cargo.toml 的 version 完全一致。
      # 这是唯一的版本真源，平台脚本也从同一个字段读取版本号。
      - name: Version guard (tag == Cargo.toml)
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#v}"
          manifest_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "release ref : ${RELEASE_TAG}"
          echo "tag version : ${tag_version}"
          echo "Cargo.toml  : ${manifest_version}"
          if [ -z "$tag_version" ]; then
            echo "::error::无法从 '${RELEASE_TAG}' 解析版本号"
            exit 1
          fi
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::tag v${tag_version} 与 Cargo.toml 版本 ${manifest_version} 不一致；请先 bump 版本再打 tag"
            exit 1
          fi
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 服务端镜像是否真的需要重建：与上一个 tag 比对服务端输入。
      # 只改客户端时这里输出 false，server-image 整个 job 直接跳过（省约 20 分钟）。
      - name: Detect server changes since previous tag
        id: server_changed
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          # 按版本号倒序找上一个 tag（排除当前正在发布的这个）。
          prev=""
          while IFS= read -r candidate; do
            [[ -z "$candidate" ]] && continue
            [[ "$candidate" == "${RELEASE_TAG}" ]] && continue
            prev="$candidate"
            break
          done < <(git tag --sort=-v:refname --merged HEAD 'v*')
          if [[ -z "$prev" ]]; then
            echo "没有上一个 tag → 保守构建服务端镜像"
            bash scripts/server-changed.sh "" "$current"
            exit 0
          fi
          prev_sha="$(git rev-list -n1 "$prev")"
          echo "previous tag: ${prev} (${prev_sha})"
          if [[ "$prev_sha" == "$current" ]]; then
            echo "同一提交（tag 重指）→ 服务端无变化"
            if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
              echo "changed=false" >>"$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          bash scripts/server-changed.sh "$prev_sha" "$current"

  # 暂时停用（2026-10-19，用户要求）：默认不打包 Linux。
  # 需要时手动触发 workflow_dispatch 并勾选 with_linux；
  # 恢复常态打包时删除下面的 if 行即可（脚本与文档保持可用）。
  linux:
    name: Linux packages
    if: ${{ inputs.with_linux }}
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake pkg-config libfontconfig-dev \
            libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev \
            libzstd-dev libasound2-dev libvulkan1
      - run: cargo build --release --locked
      - run: ./packaging/linux/build-deb.sh
      - name: Build AppImage
        run: |
          curl -sSL -o /tmp/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          # appimagetool 自带的 AppRun 依赖 AppImage 内部目录结构；单独拷贝到
          # /usr/local/bin 会以 `exec: : Permission denied` 失败。改为包装脚本 +
          # APPIMAGE_EXTRACT_AND_RUN=1（自解压运行，无需 FUSE）。
          sudo tee /usr/local/bin/appimagetool > /dev/null <<'EOF'
          #!/bin/sh
          export APPIMAGE_EXTRACT_AND_RUN=1
          exec /tmp/appimagetool "$@"
          EOF
          sudo chmod +x /usr/local/bin/appimagetool
          appimagetool --version
          ./packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz

  windows:
    name: Windows installer
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - run: pwsh -File packaging/windows/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.zip

  # 暂时停用（2026-10-19，用户要求）：默认不打包 macOS。
  # 需要时手动触发 workflow_dispatch 并勾选 with_macos；
  # 恢复常态打包时删除下面的 if 行即可（脚本与文档保持可用）。
  macos:
    name: macOS app (${{ matrix.arch }})
    if: ${{ inputs.with_macos }}
    needs: checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 已于 2025-12 退役；macos-14 在 2026-10 处于退役灰测（作业会失败）。
          # Intel 构建用 macos-15-intel（GitHub 当前唯一的 Intel 镜像），arm64 用 macos-15。
          - arch: aarch64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    # secrets 不能出现在 if: 里，先映射到 job env，再用 env.* 判断。
    # 缺 Apple secrets 时所有签名/公证步骤都会跳过，脚本退回 ad-hoc 签名，
    # 未签名的构建同样可以成功产出产物。
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo "==> Creating temporary keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "==> Importing certificate"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_PATH"

          # 让 codesign 无需交互就能取用私钥。
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          echo "==> Prepending keychain to the search list"
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          security find-identity -v -p codesigning

      # APPLE_SIGN_IDENTITY 可选：不填则从刚导入的证书里自动解析。
      - name: Resolve signing identity
        id: signing
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          if [ -n "${APPLE_SIGN_IDENTITY}" ]; then
            identity="$APPLE_SIGN_IDENTITY"
          else
            identity="$(security find-identity -v -p codesigning \
              | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          fi
          if [ -z "$identity" ]; then
            echo "::error::钥匙串里没有可用的 Developer ID Application 证书"
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "==> Signing as: $identity"

      # 公证凭据只在 Apple ID secrets 齐全时写入；否则 NOTARY_PROFILE 为空，
      # build-macos.sh 只签名、不公证。
      - name: Store notarytool credentials
        id: notary
        if: >-
          env.APPLE_CERTIFICATE_P12 != '' && env.APPLE_ID != '' &&
          env.APPLE_TEAM_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != ''
        env:
          NOTARY_PROFILE: courseplan-notary
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --keychain "$RUNNER_TEMP/signing.keychain-db" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"
          echo "profile=$NOTARY_PROFILE" >> "$GITHUB_OUTPUT"

      - name: Build bundle (sign + notarize when configured)
        env:
          ARCH: ${{ matrix.arch }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_PROFILE: ${{ steps.notary.outputs.profile }}
        run: ./packaging/macos/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.app.tar.gz

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  # 服务端镜像：一次冷启动的多架构构建约 20 分钟（arm64 走 QEMU 模拟），
  # 而多数发版只改客户端。所以先与「上一个 tag」比对服务端输入，没有改动就跳过；
  # 纯版本号 bump 不算改动（见 scripts/server-changed.sh）。
  # 需要强制重建时：workflow_dispatch 勾 with_server_image。
  server-image:
    name: Server image (ghcr.io)
    needs: checks
    if: >-
      needs.checks.result == 'success' &&
      (inputs.with_server_image || needs.checks.outputs.server_changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 可选的 Docker Hub 镜像：两个 secret 都存在时才加入推送目标。
      - name: Resolve image names
        id: images
        run: |
          set -euo pipefail
          images="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE_BASENAME}"
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            images="$images"$'\n'"docker.io/${DOCKERHUB_USERNAME}/${IMAGE_BASENAME}"
          fi
          {
            echo "images<<IMAGE_LIST_EOF"
            echo "$images"
            echo "IMAGE_LIST_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$images"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.images }}
          flavor: |
            latest=false
          # 显式给出 value，使标签只由发布 tag 决定：
          # workflow_dispatch 在分支上手动触发时 github.ref 不是 tag，
          # 若依赖 ref 推导会拿不到任何标签。
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 显式 scope：gha 缓存默认按 ref 隔离，而发版都在不同 tag 上跑，
          # 不指定 scope 就等于每次发版都冷启动（实测 24 分钟 → 40 秒）。
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,mode=max,scope=server-image

  release:
    name: Publish GitHub Release
    # 只依赖仍然启用的作业：若 needs 里含被 if 跳过的 job，GitHub 会把本作业一起跳过。
    # 因此这里用 `!cancelled()` + 逐个判断 result：server-image 被「无改动」跳过时
    # 仍要发布客户端产物（它被 skipped 不算失败）。
    needs: [checks, windows, server-image]
    if: >-
      !cancelled() &&
      needs.checks.result == 'success' &&
      needs.windows.result == 'success' &&
      (needs.server-image.result == 'success' || needs.server-image.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      # 只下载真正的发布产物：buildx 的 gha 缓存会额外上传一个
      # `*~*.dockerbuild` 工件，merge-multiple 全量下载时会解包失败。
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
          pattern: "windows-installer"
      - name: List collected assets
        run: ls -lh release-assets
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release-assets/**
          body: |
            ## 安装包（Windows）

            | 资产 | 平台 | 说明 |
            | --- | --- | --- |
            | `CoursePlan-Setup-<version>.exe` | Windows 10/11 x64 | Inno Setup 安装包（开始菜单/桌面快捷方式 + 卸载项） |
            | `CoursePlan-<version>-windows-x64.zip` | Windows 10/11 x64 | 便携版，解压即用；需「Microsoft Visual C++ 2015-2022 Redistributable (x64)」 |

            > **Linux / macOS 客户端打包自 2026-10-19 起暂时停用**（仅影响自动发版）。
            > 需要时手动触发本工作流并勾选 `with_linux` / `with_macos` 即可产出对应平台产物；
            > `packaging/linux`、`packaging/macos` 脚本与文档保持可用。

            各平台的使用与排障见 [`docs/RELEASE.md`](https://github.com/${{ github.repository }}/blob/${{ env.RELEASE_TAG }}/docs/RELEASE.md)。

            ## 服务端容器镜像

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_BASENAME }}:${{ env.RELEASE_TAG }}
            ```

            多架构（`linux/amd64` + `linux/arm64`）单 manifest 推送，
            标签规则：`${{ env.RELEASE_TAG }}`（tag 原文）、`X.Y`、`latest`。
            若维护者配置了 Docker Hub secrets，同一批标签也会推送到
            `docker.io/<dockerhub-user>/${{ env.IMAGE_BASENAME }}`。

            > 镜像只在**服务端输入自上一个版本起有改动**时重建（纯客户端发版会跳过该作业，
            > 约省 20 分钟）；跳过时上述标签仍指向上一版镜像，服务端行为不变。
            > 需要强制重建：手动触发 release 工作流并勾选 `with_server_image`。
            部署与升级见 [`docs/DEPLOY.md`](https://github.com/${{ github.repository }}/blob/${{ env.RELEASE_TAG }}/docs/DEPLOY.md)。

            ## 签名

            - **Windows**：安装包目前未接入代码签名，SmartScreen 可能提示「未知发布者」。
            - **macOS**（启用打包时）：未配置 Apple 签名 / 公证 secrets 时，`.app` 只有 ad-hoc 签名，
              首次打开需要「右键 → 打开」，或执行
              `xattr -dr com.apple.quarantine /Applications/课程计划.app`。
