[package]
name = "course-plan"
version = "0.1.0"
edition = "2024"
description = "小学课程管理计划 - 学校课程与补习课程的计划表、日程提醒、备忘与打卡"
default-run = "course-plan"

[workspace]
members = ["crates/sync-proto", "crates/server"]
resolver = "3"

[dependencies]
chrono = "0.4.45"
directories = "6.0.0"
gpui-kit = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
# 无头渲染测试保存 PNG（tests/render.rs）
image = { version = "0.25", default-features = false, features = ["png"] }

# Keep framework code optimized while application code stays debuggable.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
