[package]
name = "course-plan"
version = "0.1.0"
edition = "2024"
description = "小学课程管理计划 - 学校课程与补习课程的计划表、日程提醒、备忘与打卡"
default-run = "course-plan"

[workspace]
members = ["crates/sync-proto", "crates/server"]
resolver = "3"

[dependencies]
chrono = "0.4.45"
course-plan-sync-proto = { path = "crates/sync-proto" }
directories = "6.0.0"
# 精确锁定：theme.rs 的 ThemeConfig/ThemeConfigColors 字段集、apply_config 的
# alpha 语义（list_active ≤0.2、selection ≤0.3）与 vendor 键名（progress.bar）
# 都是针对 0.7.3 验证的；小版本漂移会让 §6.1 的冻结与对比度测试失准。
gpui-kit = "=0.7.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[dev-dependencies]
# 收敛测试（tests/convergence.rs）：进程内真实服务端 + 多客户端往返。
course-plan-server = { path = "crates/server" }
rand = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# 无头渲染/截图测试（tests/render.rs）：
# - image: 保存 PNG
# - gpui-kit/test-support: 提供 gpui::test 辅助 API，并让 gpui-pre 的
#   render_to_image / WgpuHeadlessRenderer 在集成测试里可用（feature 会与主依赖合并）
image = { version = "0.25", default-features = false, features = ["png"] }
# 与主依赖同一精确版本（见上方注释）。
gpui-kit = { version = "=0.7.3", features = ["test-support"] }

# Keep framework code optimized while application code stays debuggable.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
